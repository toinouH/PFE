<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fichiers CAVE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="fragments/header :: header"></div>

    <h1>Gestion des fichiers CAVE</h1>

    <p th:if="${successMessage}" th:text="${successMessage}" style="color: green; font-weight: bold;"></p>
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-weight: bold;"></p>

    <h2>Ajouter le fichier référentiel JSON</h2>
    <form th:action="@{/fichiers/upload-json}" method="post" enctype="multipart/form-data">
        <input type="file" name="jsonFile" accept=".json" required>
        <button type="submit">Uploader le JSON</button>
    </form>

    <h2>Ajouter un fichier XML CAVE</h2>
    <form th:action="@{/fichiers/upload-xml}" method="post" enctype="multipart/form-data">
        <input type="file" name="xmlFile" accept=".xml" required>
        <button type="submit">Uploader le XML</button>
    </form>

    <h2>Lancer le traitement</h2>
    <form th:action="@{/fichiers/enrichir}" method="post">
        <button type="submit">Créer et envoyer les fichiers aux régions</button>
    </form>

    <hr>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom fichier</th>
                <th>Date réception</th>
                <th>Date course</th>
                <th>Véhicule</th>
                <th>Statut</th>
                <th>Taux enrichissement</th>
                <th>Région</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="fichier : ${fichiers}">
                <td th:text="${fichier.idFichier}"></td>
                <td th:text="${fichier.nomFichier}"></td>
                <td th:text="${fichier.dateReception}"></td>
                <td th:text="${fichier.dateCourse}"></td>
                <td th:text="${fichier.vehicule}"></td>
                <td th:text="${fichier.statutEnrichissement}"></td>
                <td th:text="${fichier.tauxEnrichissement}"></td>
                <td th:text="${fichier.region.nom}"></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
