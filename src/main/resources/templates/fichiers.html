<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fichiers CAVE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<h1>Fichiers CAVE</h1>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nom fichier</th>
            <th>Date réception</th>
            <th>Date course</th>
            <th>Véhicule</th>
            <th>Statut</th>
            <th>Taux enrichissement</th>
            <th>Région</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="fichier : ${fichiers}">
            <td th:text="${fichier.idFichier}"></td>
            <td th:text="${fichier.nomFichier}"></td>
            <td th:text="${fichier.dateReception}"></td>
            <td th:text="${fichier.dateCourse}"></td>
            <td th:text="${fichier.vehicule}"></td>
            <td th:text="${fichier.statutEnrichissement}"></td>
            <td th:text="${fichier.tauxEnrichissement}"></td>
            <td th:text="${fichier.region.nom}"></td>
        </tr>
    </tbody>
</table>

</body>
</html>
