<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RailFlow - Connexion</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div th:replace="fragments/header :: header"></div>

    <main class="auth-wrapper">
        <div class="auth-card">
            <p style="text-align: center; font-size: 0.9rem; opacity: 0.6; margin-bottom: 30px;">Portail Gestionnaire</p>

            <div th:if="${error}" class="alert-error" style="padding:10px; border-radius:8px; margin-bottom:20px; background: var(--error-bg); color: var(--error-text); font-size: 0.8rem; text-align:center;">
                <i class="fas fa-exclamation-circle"></i> [[${error}]]
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>IDENTIFIANT</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-user" style="position:absolute; left:15px; top:15px; opacity:0.4;"></i>
                        <input type="text" name="login" placeholder="Ex: j.dupont" required autofocus>
                    </div>
                </div>

                <div class="form-group" style="margin-top:20px;">
                    <label>MOT DE PASSE</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock" style="position:absolute; left:15px; top:15px; opacity:0.4;"></i>
                        <input type="password" name="motPasse" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-rail" style="margin-top:30px;">Se connecter</button>
            </form>

            <p style="text-align: center; margin-top: 25px; font-size: 0.85rem; opacity: 0.8;">
                Nouveau ici ? <a th:href="@{/creer-compte}" style="color: var(--rail-carmillon); text-decoration: none; font-weight: bold;">Créer un compte</a>
            </p>
        </div>
    </main>

    <footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
